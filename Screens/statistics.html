<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAND HERO - إحصائيات الأداء</title>
    
    <!-- استدعاء نفس الخط المستخدم في الواجهة الأساسية -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
    
    <!-- استدعاء مكتبة الرسوم البيانية -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- ربط ملف الـ CSS الأساسي ليرث الألوان والتنسيقات -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* تنسيقات إضافية لضمان تطابق الصفحة مع روح اللعبة */
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #fdfaf3; /* نفس الخلفية الكريمية */
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        
        .header-section {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-bottom: 30px;
            position: relative;
        }

        .header-section h1 {
            color: #4a2c2a;
            font-weight: 900;
            margin: 0;
            font-size: 1.8rem;
        }

        .back-row {
            position: absolute;
            right: 0;
        }

        /* تنسيق بطاقات الرسوم البيانية لتشبه result-card و card */
        .chart-card {
            background: white;
            border: 4px solid #efe3d0; 
            border-radius: 25px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 0 #efe3d0;
        }

        .chart-card h3 {
            color: #8d5524;
            text-align: center;
            font-weight: 700;
            margin-bottom: 20px;
            font-size: 1.2rem;
            border-bottom: 2px solid #fdfaf3;
            padding-bottom: 10px;
        }

        #loadingText {
            text-align: center;
            color: #8d5524;
            font-weight: bold;
        }

        /* لضمان ظهور الرسوم بشكل جيد داخل البطاقات */
        canvas {
            max-width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الهيدر متطابق مع طلبك (الزر يمين والعنوان وسط) -->
        <div class="header-section">
            <div class="back-row">
                <button class="small-btn btn-gray" onclick="window.location.href='index.html'">رجوع</button>
            </div>
            <h1>إحصائيات الأداء</h1>
        </div>

        <p id="loadingText">جاري جلب بيانات بطلنا ...</p>

        <!-- المربع الأول: الدقة (باللون البني الأساسي) -->
        <div class="chart-card">
            <h3>📈 مستوى الدقة لكل لعبة</h3>
            <canvas id="accuracyChart"></canvas>
        </div>

        <!-- المربع الثاني: وقت الاستجابة (باللون الأصفر/الذهبي) -->
        <div class="chart-card">
            <h3>⏱️ سرعة استجابة اللاعب (ثواني)</h3>
            <canvas id="reactionChart"></canvas>
        </div>

        <!-- المربع الثالث: الأخطاء (باللون الوردي/الأحمر) -->
        <div class="chart-card">
            <h3>⚠️ رصد الحركات الخاطئة للاعب</h3>
            <canvas id="wrongMovesChart"></canvas>
        </div>
    </div>

    <script type="module" src="stats.js"></script>
</body>
</html>
