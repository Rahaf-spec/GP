<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAND HERO - إحصائيات الأداء</title>
    
    <!-- استدعاء نفس الخط المستخدم في الواجهة الأساسية -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
    
    <!-- استدعاء مكتبة الرسوم البيانية -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- ربط ملف الـ CSS الأساسي ليرث الألوان والتنسيقات -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* تنسيقات إضافية لضمان تطابق الصفحة مع روح اللعبة */
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #fdfaf3; /* نفس الخلفية الكريمية */
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        /* تنسيق الهيدر ليطابق واجهتك */
        .header-section {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-bottom: 30px;
            position: relative;
        }

        .header-section h1 {
            color: #4a2c2a;
            font-weight: 900;
            margin: 0;
            font-size: 1.8rem;
        }

        .back-row {
            position: absolute;
            right: 0;
        }

        /* تنسيق بطاقات الرسوم البيانية لتشبه result-card و card */
        .chart-card {
            background: white;
            border: 4px solid #efe3d0; /* نفس سمك حدود بطاقاتك */
            border-radius: 25px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 0 #efe3d0; /* ظل كرتوني يشبه استايل اللعبة */
        }

        .chart-card h3 {
            color: #8d5524;
            text-align: center;
            font-weight: 700;
            margin-bottom: 20px;
            font-size: 1.2rem;
            border-bottom: 2px solid #fdfaf3;
            padding-bottom: 10px;
        }

        #loadingText {
            text-align: center;
            color: #8d5524;
            font-weight: bold;
        }

        /* لضمان ظهور الرسوم بشكل جيد داخل البطاقات */
        canvas {
            max-width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الهيدر متطابق مع طلبك (الزر يمين والعنوان وسط) -->
        <div class="header-section">
            <div class="back-row">
                <button class="small-btn btn-gray" onclick="window.location.href='index.html'">رجوع</button>
            </div>
            <h1>إحصائيات الأداء</h1>
        </div>

        <p id="loadingText">جاري جلب بيانات أبطالنا...</p>

        <!-- المربع الأول: الدقة (باللون البني الأساسي) -->
        <div class="chart-card">
            <h3>📈 مستوى الدقة لكل لعبة</h3>
            <canvas id="accuracyChart"></canvas>
        </div>

        <!-- المربع الثاني: وقت الاستجابة (باللون الأصفر/الذهبي) -->
        <div class="chart-card">
            <h3>⏱️ سرعة الاستجابة (ثواني)</h3>
            <canvas id="reactionChart"></canvas>
        </div>

        <!-- المربع الثالث: الأخطاء (باللون الوردي/الأحمر) -->
        <div class="chart-card">
            <h3>⚠️ رصد الحركات الخاطئة</h3>
            <canvas id="wrongMovesChart"></canvas>
        </div>
    </div>

    <script type="module">
        import { auth, db } from "./firebase.js";
        import { ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const snapshot = await get(ref(db, `scores/${user.uid}`));
                    if (snapshot.exists()) {
                        let allGames = Object.values(snapshot.val()).sort((a, b) => a.createdAt - b.createdAt);
                        const last10 = allGames.slice(-10);
                        renderCharts(last10);
                        document.getElementById('loadingText').style.display = 'none';
                    } else {
                        document.getElementById('loadingText').innerText = "لا توجد ألعاب مسجلة بعد. ابدأ اللعب الآن!";
                    }
                } catch (error) {
                    console.error("Error:", error);
                    document.getElementById('loadingText').innerText = "حدث خطأ أثناء جلب البيانات.";
                }
            } else {
                window.location.href = 'index.html';
            }
        });

        function renderCharts(games) {
            // ألوان مستوحاة من واجهتك (btn-green, btn-purple, btn-pink)
            const colorPurple = '#a55eea'; 
            const colorGreen = '#26de81';
            const colorPink = '#ff006e';
            const colorBrown = '#8d5524';

            const labels = games.map((_, i) => `لعبة ${i + 1}`);

            // إعدادات الخطوط لتطابق Cairo
            Chart.defaults.font.family = "'Cairo', sans-serif";
            Chart.defaults.color = '#4a2c2a';

            // 1. رسم الدقة (خطي - أخضر)
            new Chart(document.getElementById('accuracyChart'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'الدقة %',
                        data: games.map(g => g.details.accuracy),
                        borderColor: colorGreen,
                        backgroundColor: 'rgba(38, 222, 129, 0.1)',
                        fill: true,
                        tension: 0.4,
                        borderWidth: 4
                    }]
                },
                options: { responsive: true }
            });

            // 2. رسم وقت الاستجابة (أعمدة - بنفسجي)
            new Chart(document.getElementById('reactionChart'), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'الثواني',
                        data: games.map(g => g.details.averageReactionTime),
                        backgroundColor: colorPurple,
                        borderRadius: 10
                    }]
                },
                options: { responsive: true }
            });

            // 3. رسم الأخطاء (أعمدة - وردي)
            new Chart(document.getElementById('wrongMovesChart'), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'الأخطاء',
                        data: games.map(g => g.details.wrongMoves),
                        backgroundColor: colorPink,
                        borderRadius: 10
                    }]
                },
                options: {
                    responsive: true,
                    scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
                }
            });
        }
    </script>
</body>
</html>
