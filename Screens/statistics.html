<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAND HERO - إحصائيات الأداء</title>
    
    <!-- استدعاء الخطوط والمكتبات -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #fdfaf3;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px; 
        }

        .header-section {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-bottom: 30px;
            position: relative;
        }

        .header-section h1 {
            color: #4a2c2a;
            font-weight: 900;
            margin: 0;
            font-size: 1.8rem;
        }

        .back-row {
            position: absolute;
            right: 0;
        }

        .chart-card {
            background: white;
            border: 4px solid #efe3d0;
            border-radius: 25px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 0 #efe3d0;
            transition: transform 0.2s ease;
        }

        .chart-card:hover {
            transform: translateY(-5px);
        }

        .chart-card h3 {
            color: #8d5524;
            text-align: center;
            font-weight: 700;
            margin-bottom: 20px;
            font-size: 1.2rem;
            border-bottom: 2px solid #fdfaf3;
            padding-bottom: 10px;
        }

        #loadingText {
            text-align: center;
            color: #8d5524;
            font-weight: bold;
        }

        canvas {
            max-width: 100%;
            height: auto !important;
        }

        /* تنسيق إضافي للأزرار ليتناسب مع الهوية */
        .small-btn {
            padding: 8px 20px;
            border-radius: 15px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: bold;
            border: none;
            box-shadow: 0 4px 0 #ccc;
            background-color: #e0e0e0;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-section">
            <div class="back-row">
                <button class="small-btn" onclick="window.location.href='index.html'">رجوع</button>
            </div>
            <h1>إحصائيات البطل 🏆</h1>
        </div>

        <p id="loadingText">جاري جلب بيانات بطلنا وتحليلها...</p>

        <!-- 1. الدقة الكلية -->
        <div class="chart-card">
            <h3>📈 مستوى الدقة العام (%)</h3>
            <canvas id="accuracyChart"></canvas>
        </div>

        <!-- 2. دقة حركة الفتح بنسبة مئوية -->
        <div class="chart-card">
            <h3>🟢 فتح اليد بشكل صحيح(Open) %</h3>
            <canvas id="openGestureChart"></canvas>
        </div>

        <!-- 3. دقة حركة الإغلاق بنسبة مئوية -->
        <div class="chart-card">
            <h3>🔵   إغلاق اليد بشكل صحيح (Close) %</h3>
            <canvas id="closeGestureChart"></canvas>
        </div>

        <!-- 4. وقت الاستجابة -->
        <div class="chart-card">
            <h3>⏱️ سرعة الاستجابة (ثواني)</h3>
            <canvas id="reactionChart"></canvas>
        </div>

        <!-- 5. الأخطاء -->
        <div class="chart-card">
            <h3>⚠️ رصد الحركات الخاطئة</h3>
            <canvas id="wrongMovesChart"></canvas>
        </div>
        
    </div>

    
    <script type="module" src="stats.js"></script>
</body>
</html>
